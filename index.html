<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pomodoro</title>
<style>
  :root {
    --bg: #0f1115;
    --fg: #e8e8ea;
    --muted: #8a8f99;
    --accent: #f5a97f;
    --panel: #171a21;
    --border: #262a33;
    --danger: #e06c75;
  }
  body[data-phase="relax"] { --accent: #7fd1c6; }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Helvetica, Arial, sans-serif;
    overflow: hidden;
    display: grid;
    place-items: center;
    transition: background .6s;
  }

  /* ---- GIF layer ---- */
  #gifs { position: fixed; inset: 0; pointer-events: none; z-index: 3; }
  #gifs img {
    position: absolute;
    border-radius: 12px;
    box-shadow: 0 10px 30px rgba(0,0,0,.45);
    opacity: 0;
    transform: scale(.92) rotate(var(--tilt, 0deg));
    animation: gif-in .5s ease-out forwards;
  }
  #gifs img.leaving { animation: gif-out .5s ease-in forwards; }
  @keyframes gif-in  { to { opacity: 1; transform: scale(1) rotate(var(--tilt, 0deg)); } }
  @keyframes gif-out { from { opacity: 1; } to { opacity: 0; transform: scale(.9) rotate(var(--tilt, 0deg)); } }

  /* ---- Timer ---- */
  main {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 2rem 3rem;
    min-width: 320px;
  }
  #phase {
    text-transform: lowercase;
    letter-spacing: .3em;
    font-size: .85rem;
    color: var(--accent);
    transition: color .6s;
  }
  #clock {
    font-size: clamp(5rem, 18vw, 11rem);
    font-weight: 200;
    font-variant-numeric: tabular-nums;
    line-height: 1;
    margin: .3rem 0 1rem;
    letter-spacing: -.02em;
  }
  #cycles { color: var(--muted); font-size: .8rem; min-height: 1.2em; }

  .durations {
    display: flex; gap: 1.5rem; justify-content: center;
    margin: 1.25rem 0 1rem; color: var(--muted); font-size: .85rem;
  }
  .durations label { display: flex; flex-direction: column; gap: .35rem; align-items: center; }
  .durations input {
    width: 4.5rem; text-align: center; font-size: 1.1rem;
    background: transparent; color: var(--fg);
    border: 1px solid var(--border); border-radius: 8px; padding: .35rem .25rem;
  }
  .durations input:focus { outline: none; border-color: var(--accent); }

  .controls { display: flex; gap: .75rem; justify-content: center; }
  button {
    font: inherit; cursor: pointer; border-radius: 999px;
    border: 1px solid var(--border); background: transparent; color: var(--fg);
    padding: .6rem 1.4rem; transition: background .15s, border-color .15s, color .15s;
  }
  button:hover { border-color: var(--accent); }
  button.primary { background: var(--accent); color: #0f1115; border-color: var(--accent); font-weight: 600; min-width: 7rem; }
  button.primary:hover { filter: brightness(1.08); }
  button:disabled { opacity: .4; cursor: default; }

  /* ---- Cog ---- */
  #cog {
    position: fixed; top: 1rem; right: 1rem; z-index: 5;
    width: 2.6rem; height: 2.6rem; padding: 0; display: grid; place-items: center;
    border-radius: 50%; color: var(--muted);
  }
  #cog:hover { color: var(--fg); transform: rotate(30deg); }
  #cog svg { width: 1.3rem; height: 1.3rem; }

  /* ---- Settings panel ---- */
  #settings {
    position: fixed; top: 0; right: 0; bottom: 0; z-index: 6;
    width: min(420px, 100vw);
    background: var(--panel); border-left: 1px solid var(--border);
    transform: translateX(100%); transition: transform .25s ease;
    overflow-y: auto; padding: 1.25rem 1.25rem 2rem;
    font-size: .9rem;
  }
  #settings.open { transform: translateX(0); }
  #settings header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
  #settings h2 { margin: 0; font-size: 1rem; font-weight: 600; letter-spacing: .05em; }
  #settings h3 { margin: 1.5rem 0 .5rem; font-size: .75rem; letter-spacing: .2em; text-transform: uppercase; color: var(--muted); }
  #settings .close { width: 2rem; height: 2rem; padding: 0; border-radius: 50%; }

  .gif-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: .4rem; }
  .gif-list li {
    display: grid; grid-template-columns: 44px 1fr auto; gap: .6rem; align-items: center;
    background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: .35rem .5rem;
  }
  .gif-list img { width: 44px; height: 44px; object-fit: cover; border-radius: 6px; background: #000; }
  .gif-list .url { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); font-size: .75rem; }
  .gif-list .remove { padding: .2rem .55rem; border-radius: 6px; color: var(--muted); }
  .gif-list .remove:hover { color: var(--danger); border-color: var(--danger); }
  .gif-list .empty { color: var(--muted); font-style: italic; justify-content: center; grid-template-columns: 1fr; text-align: center; }

  .cadence { display: flex; flex-wrap: wrap; gap: .4rem .9rem; align-items: center; margin: 0 0 .6rem; color: var(--muted); font-size: .8rem; }
  .cadence span { white-space: nowrap; display: inline-flex; align-items: center; gap: .3rem; }
  .cadence input {
    width: 3.2rem; font: inherit; font-size: .85rem; text-align: center; background: var(--bg); color: var(--fg);
    border: 1px solid var(--border); border-radius: 8px; padding: .3rem .2rem;
  }
  .cadence input:focus { outline: none; border-color: var(--accent); }
  .add-row { display: flex; gap: .5rem; margin-top: .5rem; }
  .add-row input, .chime-row input {
    flex: 1; font: inherit; font-size: .85rem; background: var(--bg); color: var(--fg);
    border: 1px solid var(--border); border-radius: 8px; padding: .5rem .7rem; min-width: 0;
  }
  .add-row input:focus, .chime-row input:focus { outline: none; border-color: var(--accent); }
  .add-row button, .chime-row button { padding: .45rem 1rem; border-radius: 8px; }
  .chime-row { display: flex; gap: .5rem; margin-bottom: .6rem; }
  .chime-label { display: block; color: var(--muted); font-size: .8rem; margin: 0 0 .3rem; }
  .hint { color: var(--muted); font-size: .75rem; margin: .4rem 0 0; }
  .settings-footer { margin-top: 2rem; display: flex; justify-content: space-between; align-items: center; }
  .settings-footer button { font-size: .8rem; padding: .45rem 1rem; }
  #saveStatus.flash { color: var(--accent); transition: none; }
  #saveStatus { transition: color 1.2s ease; }

  #scrim { position: fixed; inset: 0; z-index: 4; background: rgba(0,0,0,.35); display: none; }
  #scrim.open { display: block; }
</style>
</head>
<body data-phase="focus">

<div id="gifs" aria-hidden="true"></div>

<main>
  <div id="phase">focus</div>
  <div id="clock">15:00</div>
  <div id="cycles"></div>

  <div class="durations">
    <label>focus <input id="focusMin" type="number" min="1" step="1" value="15"> </label>
    <label>relax <input id="relaxMin" type="number" min="1" step="1" value="5"> </label>
  </div>

  <div class="controls">
    <button id="startBtn" class="primary">Start</button>
    <button id="resetBtn">Reset</button>
  </div>
</main>

<button id="cog" title="Settings" aria-label="Settings">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="12" cy="12" r="3"/>
    <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>
  </svg>
</button>

<div id="scrim"></div>
<aside id="settings" aria-label="Settings">
  <header>
    <h2>Settings</h2>
    <button class="close" id="closeSettings" aria-label="Close">×</button>
  </header>

  <h3>Focus GIFs</h3>
  <div class="cadence" data-kind="focus">
    <span>shows for <input type="number" min="1" step="1" data-field="lifetime" title="seconds each gif stays on screen"> s</span>
    <span>next after <input type="number" min="0" step="1" data-field="nextMin" title="minimum seconds before the next gif">–<input type="number" min="0" step="1" data-field="nextMax" title="maximum seconds before the next gif"> s</span>
  </div>
  <ul class="gif-list" id="focusList"></ul>
  <form class="add-row" data-kind="focusGifs">
    <input type="url" placeholder="https://…/something.gif" required>
    <button type="submit">Add</button>
  </form>

  <h3>Relax GIFs</h3>
  <div class="cadence" data-kind="relax">
    <span>shows for <input type="number" min="1" step="1" data-field="lifetime" title="seconds each gif stays on screen"> s</span>
    <span>next after <input type="number" min="0" step="1" data-field="nextMin" title="minimum seconds before the next gif">–<input type="number" min="0" step="1" data-field="nextMax" title="maximum seconds before the next gif"> s</span>
  </div>
  <ul class="gif-list" id="relaxList"></ul>
  <form class="add-row" data-kind="relaxGifs">
    <input type="url" placeholder="https://…/something.gif" required>
    <button type="submit">Add</button>
  </form>

  <h3>Chimes</h3>
  <label class="chime-label" for="focusChimeUrl">when focus ends</label>
  <div class="chime-row">
    <input id="focusChimeUrl" type="url" data-kind="focus" placeholder="leave empty for the built-in soft bell">
    <button type="button" class="test-chime" data-kind="focus">Test</button>
  </div>
  <label class="chime-label" for="relaxChimeUrl">when relax ends</label>
  <div class="chime-row">
    <input id="relaxChimeUrl" type="url" data-kind="relax" placeholder="leave empty for the built-in soft bell">
    <button type="button" class="test-chime" data-kind="relax">Test</button>
  </div>
  <p class="hint">URLs of audio files (mp3, wav, ogg…). Falls back to the built-in bell if one can't play.</p>

  <div class="settings-footer">
    <span class="hint" id="saveStatus">Changes are saved in this browser automatically.</span>
    <button type="button" id="restoreDefaults">Restore defaults</button>
  </div>
</aside>

<script>
(() => {
  // ---------- defaults & persistence ----------
  const DEFAULTS = {
    focusMin: 15,
    relaxMin: 5,
    // sounds played when a period ends (from myinstants.com); empty = built-in soft bell
    focusChimeUrl: 'https://www.myinstants.com/media/sounds/yippie_2IJl9cR.mp3',   // "yippie" when focus ends
    relaxChimeUrl: 'https://www.myinstants.com/media/sounds/faaah.mp3',           // "faaah" when relax ends
    // seconds: how long each gif stays, and the min/max gap before the next one appears
    focusCadence: { lifetime: 30, nextMin: 19, nextMax: 27 },
    relaxCadence: { lifetime: 5,  nextMin: 1.5, nextMax: 1.5 },
    focusGifs: [
      'https://media4.giphy.com/media/v1.Y2lkPTZjMDliOTUyanNubDY5ZmNyNnI4aWJwdnBncDN5ZDZ2cTFsam1vb2VtaTQ3c2gydiZlcD12MV9naWZzX3NlYXJjaCZjdD1n/m22Lj3VfcwDNvqc2Rd/200.gif',
      'https://media4.giphy.com/media/v1.Y2lkPTZjMDliOTUyanNubDY5ZmNyNnI4aWJwdnBncDN5ZDZ2cTFsam1vb2VtaTQ3c2gydiZlcD12MV9naWZzX3NlYXJjaCZjdD1n/qZgHBlenHa1zKqy6Zn/200w.gif',
      'https://media4.giphy.com/media/v1.Y2lkPTZjMDliOTUyanNubDY5ZmNyNnI4aWJwdnBncDN5ZDZ2cTFsam1vb2VtaTQ3c2gydiZlcD12MV9naWZzX3NlYXJjaCZjdD1n/C7grnU4M3o5on6ALso/200w.gif',
      'https://media.tenor.com/1s_ji1b00LcAAAAM/cat-stare.gif',
    ],
    relaxGifs: [
      'https://media.tenor.com/YfUCc6gacQMAAAAM/cats-dancing-brazil-dance.gif',
      'https://media.tenor.com/aGj-frNYMFEAAAAM/cat-cat-dance.gif',
      'https://media.tenor.com/sRrwlJNA744AAAAM/kitten-kitten-dance.gif',
      'https://media.tenor.com/8dTA0WCA99AAAAAM/cats-cat.gif',
    ],
  };
  const STORAGE_KEY = 'pomodoro.settings.v1';

  function loadSettings() {
    try {
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null');
      if (!saved) return structuredClone(DEFAULTS);
      const merged = { ...structuredClone(DEFAULTS), ...saved };
      for (const k of ['focusCadence', 'relaxCadence']) merged[k] = { ...DEFAULTS[k], ...(saved[k] || {}) };
      // Older versions stored a single chimeUrl: carry a custom choice over to both phases,
      // but an old default (or an empty value the user never set) gets the new per-phase defaults.
      if (saved.focusChimeUrl === undefined && saved.relaxChimeUrl === undefined && 'chimeUrl' in saved) {
        const old = saved.chimeUrl || '';
        const wasOldDefault = old === DEFAULTS.relaxChimeUrl || (old === '' && !saved.chimeTouched);
        if (!wasOldDefault) { merged.focusChimeUrl = old; merged.relaxChimeUrl = old; }
      }
      delete merged.chimeUrl; delete merged.chimeTouched;
      return merged;
    } catch { return structuredClone(DEFAULTS); }
  }
  let saveFlashHandle = null;
  function saveSettings() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(settings)); } catch { return; }
    // Brief visual confirmation in the settings footer.
    const el = document.getElementById('saveStatus');
    if (!el) return;
    el.textContent = 'Saved ✓';
    el.classList.add('flash');
    clearTimeout(saveFlashHandle);
    saveFlashHandle = setTimeout(() => {
      el.classList.remove('flash');
      el.textContent = 'Changes are saved in this browser automatically.';
    }, 1500);
  }
  let settings = loadSettings();
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(settings)); } catch {}   // persist any migration applied while loading

  // ---------- DOM ----------
  const $ = (id) => document.getElementById(id);
  const clockEl = $('clock'), phaseEl = $('phase'), cyclesEl = $('cycles');
  const focusMinEl = $('focusMin'), relaxMinEl = $('relaxMin');
  const startBtn = $('startBtn'), resetBtn = $('resetBtn');
  const gifLayer = $('gifs');
  const settingsEl = $('settings'), scrim = $('scrim');

  focusMinEl.value = settings.focusMin;
  relaxMinEl.value = settings.relaxMin;
  $('focusChimeUrl').value = settings.focusChimeUrl;
  $('relaxChimeUrl').value = settings.relaxChimeUrl;

  // ---------- timer state ----------
  let phase = 'focus';          // 'focus' | 'relax'
  let running = false;
  let endAt = null;             // timestamp (ms) when current period ends
  let remainingMs = minutesOf('focus') * 60_000;
  let completedFocus = 0;
  let tickHandle = null;
  const elapsed = { focus: 0, relax: 0 };   // ms actually spent running in each phase
  let lastTick = null;                      // timestamp of the last accounting tick

  function accountTime() {
    if (!running || lastTick === null) return;
    const now = Date.now();
    elapsed[phase] += Math.min(now, endAt) - lastTick;
    lastTick = now;
  }
  const mins = (ms) => Math.round(ms / 60_000);

  function minutesOf(p) {
    const el = p === 'focus' ? focusMinEl : relaxMinEl;
    const v = parseFloat(el.value);
    return Number.isFinite(v) && v > 0 ? v : DEFAULTS[p + 'Min'];
  }

  function fmt(ms) {
    const total = Math.max(0, Math.ceil(ms / 1000));
    const m = Math.floor(total / 60), s = total % 60;
    return `${String(m).padStart(2, '0')}:${String(s).padStart(2, '0')}`;
  }

  function render() {
    const txt = fmt(running ? endAt - Date.now() : remainingMs);
    clockEl.textContent = txt;
    document.title = running ? `${txt} · ${phase}` : 'Pomodoro';
    phaseEl.textContent = phase;
    document.body.dataset.phase = phase;
    startBtn.textContent = running ? 'Pause' : (endAt === null && remainingMs === minutesOf(phase) * 60_000 ? 'Start' : 'Resume');
    const total = elapsed.focus + elapsed.relax;
    cyclesEl.textContent = (completedFocus || total > 0)
      ? `${completedFocus} focus ${completedFocus === 1 ? 'session' : 'sessions'} done ` +
        `(overall time: ${mins(total)} ${mins(total) === 1 ? 'min' : 'mins'}, focus time: ${mins(elapsed.focus)} ${mins(elapsed.focus) === 1 ? 'min' : 'mins'})`
      : '';
  }

  function tick() {
    if (!running) return;
    accountTime();
    if (Date.now() >= endAt) { endPeriod(); return; }
    render();
  }

  function start() {
    if (running) return;
    ensureAudio();
    running = true;
    endAt = Date.now() + remainingMs;
    lastTick = Date.now();
    tickHandle = setInterval(tick, 200);
    startGifs();
    render();
  }

  function pause() {
    if (!running) return;
    accountTime();
    running = false;
    remainingMs = Math.max(0, endAt - Date.now());
    clearInterval(tickHandle); tickHandle = null;
    stopGifs();
    render();
  }

  function reset() {
    running = false;
    clearInterval(tickHandle); tickHandle = null;
    phase = 'focus';
    endAt = null;
    remainingMs = minutesOf('focus') * 60_000;
    completedFocus = 0;
    elapsed.focus = 0; elapsed.relax = 0; lastTick = null;
    stopGifs(true);
    render();
  }

  function endPeriod() {
    chime(phase);                       // sound for the period that just ended
    if (phase === 'focus') completedFocus++;
    phase = phase === 'focus' ? 'relax' : 'focus';
    remainingMs = minutesOf(phase) * 60_000;
    endAt = Date.now() + remainingMs;
    lastTick = Date.now();
    stopGifs(true);
    startGifs();
    render();
  }

  startBtn.addEventListener('click', () => running ? pause() : start());
  resetBtn.addEventListener('click', reset);
  document.addEventListener('keydown', (e) => {
    if (e.code === 'Space' && !/INPUT|TEXTAREA|BUTTON/.test(e.target.tagName) && !settingsEl.classList.contains('open')) {
      e.preventDefault(); running ? pause() : start();
    }
    if (e.key === 'Escape') closeSettings();
  });

  // Durations are saved on every keystroke (so a refresh never loses them);
  // changing one while idle re-arms the current period.
  for (const el of [focusMinEl, relaxMinEl]) {
    el.addEventListener('input', () => {
      settings.focusMin = minutesOf('focus');
      settings.relaxMin = minutesOf('relax');
      saveSettings();
      if (!running && endAt === null) { remainingMs = minutesOf(phase) * 60_000; render(); }
    });
  }

  // ---------- chime ----------
  let audioCtx = null;
  function ensureAudio() {
    try {
      audioCtx ||= new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch {}
  }
  function chime(endedPhase = phase) {
    const url = settings[endedPhase + 'ChimeUrl'];
    if (url) {
      const a = new Audio(url);
      a.volume = 0.7;
      a.play().catch(builtinChime);
      return;
    }
    builtinChime();
  }
  function builtinChime() {
    ensureAudio();
    if (!audioCtx) return;
    const now = audioCtx.currentTime;
    // A soft two-note bell: fundamental + a quieter fifth, slow decay.
    [[880, 0.22, 0], [1318.5, 0.10, 0.18], [1760, 0.05, 0]].forEach(([freq, gain, delay]) => {
      const osc = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      const t = now + delay;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(gain, t + 0.015);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 2.2);
      osc.connect(g).connect(audioCtx.destination);
      osc.start(t);
      osc.stop(t + 2.3);
    });
  }

  // ---------- gifs ----------
  // Per-phase cadence (from settings, in seconds): each gif stays for `lifetime`;
  // the next one appears `nextMin..nextMax` after the previous.
  const MAX_VISIBLE = 4;
  function cadence(p = phase) {
    const c = settings[p + 'Cadence'] || DEFAULTS[p + 'Cadence'];
    const lifetime = Math.max(1, +c.lifetime || DEFAULTS[p + 'Cadence'].lifetime);
    let nextMin = Math.max(0, +c.nextMin || 0), nextMax = Math.max(0, +c.nextMax || 0);
    if (nextMax < nextMin) nextMax = nextMin;
    return { lifetime: lifetime * 1000, nextMin: nextMin * 1000, nextMax: nextMax * 1000 };
  }
  let spawnHandle = null, lastGif = null, nextSide = 'left';

  function currentGifs() { return settings[phase + 'Gifs'] || []; }

  function startGifs() {
    stopGifs();
    const list = currentGifs();
    if (!list.length) return;
    list.forEach((u) => { const im = new Image(); im.src = u; });   // warm the cache
    spawnGif();
  }

  function stopGifs(clear = false) {
    clearTimeout(spawnHandle); spawnHandle = null;
    if (clear) gifLayer.replaceChildren();
  }

  function scheduleNext() {
    const c = cadence();
    clearTimeout(spawnHandle);
    spawnHandle = setTimeout(spawnGif, c.nextMin + Math.random() * (c.nextMax - c.nextMin));
  }

  function spawnGif() {
    scheduleNext();
    const list = currentGifs();
    if (!list.length || gifLayer.children.length >= MAX_VISIBLE) return;
    let url = list[Math.floor(Math.random() * list.length)];
    if (list.length > 1 && url === lastGif) url = list[(list.indexOf(url) + 1) % list.length];
    lastGif = url;

    const size = Math.round(150 + Math.random() * 130);
    const spot = findSpot(size, nextSide);
    if (!spot) return;                       // no room that keeps the timer readable; try again next tick
    nextSide = nextSide === 'left' ? 'right' : 'left';   // alternate sides of the screen
    const img = document.createElement('img');
    img.src = url;
    img.width = size;
    img.style.width = size + 'px';
    img.style.maxHeight = size + 'px';
    img.style.left = spot.x + 'px';
    img.style.top = spot.y + 'px';
    img.style.setProperty('--tilt', (Math.random() * 16 - 8).toFixed(1) + 'deg');
    img.onerror = () => img.remove();
    gifLayer.appendChild(img);

    setTimeout(() => {
      img.classList.add('leaving');
      setTimeout(() => img.remove(), 520);
    }, cadence().lifetime);
  }

  // Random position for a size×size box on the given side of the screen, clear of the timer card.
  function findSpot(size, side) {
    const keep = document.querySelector('main').getBoundingClientRect();
    const pad = 12;                                   // breathing room around the card
    const maxY = Math.max(0, innerHeight - size);
    // Horizontal band for the requested side; fall back to the whole width if that side has no room.
    let minX = 0, maxX = Math.max(0, innerWidth - size);
    if (side === 'left')  maxX = Math.min(maxX, Math.floor(keep.left - pad - size));
    if (side === 'right') minX = Math.ceil(keep.right + pad);
    if (maxX < minX) { minX = 0; maxX = Math.max(0, innerWidth - size); }
    for (let i = 0; i < 40; i++) {
      const x = Math.round(minX + Math.random() * (maxX - minX)), y = Math.round(Math.random() * maxY);
      const overlaps = x < keep.right + pad && x + size > keep.left - pad &&
                       y < keep.bottom + pad && y + size > keep.top - pad;
      if (!overlaps) return { x, y };
    }
    return null;
  }

  // ---------- settings panel ----------
  function openSettings() { settingsEl.classList.add('open'); scrim.classList.add('open'); renderLists(); }
  function closeSettings() { settingsEl.classList.remove('open'); scrim.classList.remove('open'); }
  $('cog').addEventListener('click', openSettings);
  $('closeSettings').addEventListener('click', closeSettings);
  scrim.addEventListener('click', closeSettings);

  function renderLists() {
    renderList('focusList', 'focusGifs');
    renderList('relaxList', 'relaxGifs');
    renderCadence();
  }
  function renderCadence() {
    document.querySelectorAll('.cadence').forEach((row) => {
      const c = settings[row.dataset.kind + 'Cadence'];
      row.querySelectorAll('input').forEach((inp) => { inp.value = c[inp.dataset.field]; });
    });
  }
  document.querySelectorAll('.cadence input').forEach((inp) => {
    const save = () => {
      const kind = inp.closest('.cadence').dataset.kind;
      const v = parseFloat(inp.value);
      if (Number.isFinite(v) && v >= 0) settings[kind + 'Cadence'][inp.dataset.field] = v;
      saveSettings();
    };
    inp.addEventListener('input', save);                              // persist as you type
    inp.addEventListener('change', () => { save(); renderCadence(); }); // normalise once editing ends
  });
  function renderList(listId, kind) {
    const ul = $(listId);
    ul.replaceChildren();
    const urls = settings[kind];
    if (!urls.length) {
      const li = document.createElement('li');
      li.className = 'empty';
      li.textContent = 'no gifs — add one below';
      ul.appendChild(li);
      return;
    }
    urls.forEach((url, i) => {
      const li = document.createElement('li');
      const img = document.createElement('img'); img.src = url; img.alt = '';
      const span = document.createElement('span'); span.className = 'url'; span.textContent = url; span.title = url;
      const rm = document.createElement('button'); rm.className = 'remove'; rm.textContent = '×'; rm.title = 'Remove';
      rm.addEventListener('click', () => { settings[kind].splice(i, 1); saveSettings(); renderLists(); });
      li.append(img, span, rm);
      ul.appendChild(li);
    });
  }

  document.querySelectorAll('form.add-row').forEach((form) => {
    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const input = form.querySelector('input');
      const url = input.value.trim();
      if (!url) return;
      const kind = form.dataset.kind;
      if (!settings[kind].includes(url)) { settings[kind].push(url); saveSettings(); }
      input.value = '';
      renderLists();
    });
  });

  function setChime(kind, url) { settings[kind + 'ChimeUrl'] = url.trim(); saveSettings(); }
  for (const kind of ['focus', 'relax']) {
    $(kind + 'ChimeUrl').addEventListener('input', (e) => setChime(kind, e.target.value));
  }
  document.querySelectorAll('.test-chime').forEach((btn) => {
    btn.addEventListener('click', () => {
      const kind = btn.dataset.kind;
      setChime(kind, $(kind + 'ChimeUrl').value);
      ensureAudio();
      chime(kind);
    });
  });

  $('restoreDefaults').addEventListener('click', () => {
    settings = structuredClone(DEFAULTS);
    saveSettings();
    focusMinEl.value = settings.focusMin;
    relaxMinEl.value = settings.relaxMin;
    $('focusChimeUrl').value = settings.focusChimeUrl;
    $('relaxChimeUrl').value = settings.relaxChimeUrl;
    renderLists();
    if (!running && endAt === null) { remainingMs = minutesOf(phase) * 60_000; render(); }
  });

  render();
})();
</script>
</body>
</html>
